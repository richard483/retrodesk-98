<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS2</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px "Pixelated MS Sans Serif", Arial, sans-serif; }
  #emu { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #status { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: #c0c0c0; text-align: center; padding: 16px; pointer-events: none; }
  #status .warn { color: #ffd060; max-width: 460px; }
  #toast { position: absolute; left: 8px; bottom: 8px; background: #ffffe1; color: #000; border: 1px solid #000; padding: 3px 6px; display: none; z-index: 9; }
</style>
</head>
<body>
<iframe id="emu" allow="fullscreen; gamepad; autoplay; cross-origin-isolated" hidden></iframe>
<div id="status">Loading…</div>
<div id="toast"></div>
<script type="module" src="/ps2.js"></script>
</body>
</html>
