<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSP</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font: 12px "Pixelated MS Sans Serif", Arial, sans-serif; }
  /* PPSSPP sizes its drawing buffer from the canvas's CSS size (and the device pixel ratio). */
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #status { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; color: #c0c0c0; text-align: center; padding: 16px; pointer-events: none; }
  #toast { position: absolute; left: 8px; bottom: 8px; background: #ffffe1; color: #000; border: 1px solid #000; padding: 3px 6px; display: none; z-index: 9; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<div id="toast"></div>
<script type="module" src="/psp.js"></script>
</body>
</html>
