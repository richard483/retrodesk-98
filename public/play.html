<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px "Pixelated MS Sans Serif", Arial, sans-serif; }
  #game { width: 100%; height: 100%; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c0c0c0; pointer-events: none; }
  #toast { position: absolute; left: 8px; bottom: 8px; background: #ffffe1; color: #000; border: 1px solid #000; padding: 3px 6px; display: none; z-index: 99999; }
</style>
</head>
<body>
<div id="game"></div>
<div id="status">Loading…</div>
<div id="toast"></div>
<script type="module" src="/play.js"></script>
</body>
</html>
